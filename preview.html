<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>GitHub Profile Preview</title>
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .profile-card {
      max-width: 820px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 26px;
      letter-spacing: 2px;
      margin-bottom: 6px;
      color: #ffffff;
      font-weight: 700;
    }

    .subtitle {
      color: #8b949e;
      font-size: 15px;
      margin-top: 0;
      margin-bottom: 24px;
    }

    .terminal-container {
      margin: 25px 0;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .badges {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 25px;
    }
  </style>
</head>

<body>
  <div class="profile-card">
    <h1>LE QUOC HUY</h1>
    <p class="subtitle"><strong>Fullstack &amp; Mobile Developer &bull; Building Scalable Applications</strong></p>

    <!-- Typing animation -->
    <div>
      <img
        src="https://readme-typing-svg.demolab.com?font=JetBrains+Mono&weight=500&size=15&duration=2800&pause=1000&color=FFFFFF&center=true&vCenter=true&width=720&height=36&lines=Fullstack+%26+Mobile+Developer;Languages:+Java+%C2%B7+JavaScript+%C2%B7+TypeScript+%C2%B7+SQL;Frameworks:+React+%C2%B7+React+Native+%C2%B7+Flutter+%C2%B7+NodeJS;%22Turning+ideas+into+high-performance+apps.%22"
        alt="Typing SVG" />
    </div>

    <!-- Terminal SVG -->
    <div class="terminal-container">
      <img src="./assets/terminal.svg" width="100%" alt="Terminal Window" />
    </div>

    <!-- Badges -->
    <div class="badges">
      <a href="https://github.com/lehuy9413">
        <img
          src="https://img.shields.io/badge/PORTFOLIO-lehuy9413-000000?style=flat-square&logo=github&logoColor=white" />
      </a>
      <a href="mailto:lehuy9413@gmail.com">
        <img src="https://img.shields.io/badge/EMAIL-lehuy9413%40gmail.com-000000?style=flat-square&logo=gmail&logoColor=white" />
      </a>
      <a href="https://www.facebook.com/H.Luwar">
        <img
          src="https://img.shields.io/badge/FACEBOOK-H.Luwar-000000?style=flat-square&logo=facebook&logoColor=white" />
      </a>
      <img
        src="https://komarev.com/ghpvc/?username=lehuy9413&style=flat-square&color=ffffff&labelColor=18181b&label=VISITORS" />
    </div>
  </div>
</body>

</html>
