<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="240">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      
      text {
        font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
        user-select: none;
      }
      
      /* Slide Transitions: 21s total (7s per slide) */
      @keyframes s1 {
        0%, 28.5% { opacity: 1; visibility: visible; }
        33.3%, 95.2% { opacity: 0; visibility: hidden; }
        100% { opacity: 1; visibility: visible; }
      }
      @keyframes s2 {
        0%, 28.5% { opacity: 0; visibility: hidden; }
        33.3%, 61.9% { opacity: 1; visibility: visible; }
        66.6%, 100% { opacity: 0; visibility: hidden; }
      }
      @keyframes s3 {
        0%, 61.9% { opacity: 0; visibility: hidden; }
        66.6%, 95.2% { opacity: 1; visibility: visible; }
        100% { opacity: 0; visibility: hidden; }
      }
      
      .slide-1 { animation: s1 21s ease-in-out infinite; }
      .slide-2 { animation: s2 21s ease-in-out infinite; }
      .slide-3 { animation: s3 21s ease-in-out infinite; }
      
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor { animation: blink 1s infinite; }
      
      /* Terminal Typography */
      .prompt-user { fill: #38bdf8; font-weight: 600; font-size: 13px; }
      .cmd         { fill: #f4f4f5; font-size: 13px; }
      .key         { fill: #71717a; font-size: 12px; }
      .val         { fill: #f4f4f5; font-size: 12px; }
      .val-bold    { fill: #ffffff; font-size: 12px; font-weight: 600; }
      .val-dim     { fill: #a1a1aa; font-size: 12px; }
      .meta        { fill: #52525b; font-size: 11px; }
      .status-ok   { fill: #22c55e; font-size: 11px; font-weight: 500; }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect width="800" height="240" rx="10" fill="#09090b" stroke="#27272a" stroke-width="1.2"/>

  <!-- Title Bar -->
  <rect width="800" height="32" rx="10" fill="#141417"/>
  <rect y="22" width="800" height="10" fill="#141417"/>
  <line x1="0" y1="32" x2="800" y2="32" stroke="#27272a" stroke-width="1"/>

  <!-- macOS Window Controls (Red, Yellow, Green) -->
  <circle cx="20" cy="16" r="4.5" fill="#ff5f56"/>
  <circle cx="35" cy="16" r="4.5" fill="#ffbd2e"/>
  <circle cx="50" cy="16" r="4.5" fill="#27c93f"/>

  <!-- Window Header -->
  <text x="400" y="20" class="meta" text-anchor="middle" letter-spacing="1">lehuy@workstation:~</text>

  <!-- Slide Indicators -->
  <g class="slide-1"><text x="780" y="20" class="meta" text-anchor="end">[ 1 / 3 ]</text></g>
  <g class="slide-2"><text x="780" y="20" class="meta" text-anchor="end">[ 2 / 3 ]</text></g>
  <g class="slide-3"><text x="780" y="20" class="meta" text-anchor="end">[ 3 / 3 ]</text></g>

  <!-- ════════ SLIDE 1: WHOAMI ════════ -->
  <g class="slide-1">
    <text y="62">
      <tspan x="24" class="prompt-user">lehuy@workstation:~$</tspan>
      <tspan class="cmd"> whoami</tspan>
      <tspan class="cursor" fill="#38bdf8">_</tspan>
    </text>
    
    <text y="92">
      <tspan x="24" class="key">name</tspan>
      <tspan x="125" class="val">Le Huy</tspan>
      <tspan class="meta"> (Developer)</tspan>
    </text>
    
    <text y="120">
      <tspan x="24" class="key">role</tspan>
      <tspan x="125" class="val">Fullstack &amp; Mobile Developer</tspan>
    </text>
    
    <text y="148">
      <tspan x="24" class="key">stack</tspan>
      <tspan x="125" class="val-dim">React · React Native · Flutter · NodeJS · Java</tspan>
    </text>
    
    <text y="176">
      <tspan x="24" class="key">motto</tspan>
      <tspan x="125" class="val">"Turning complex problems into clean, elegant code."</tspan>
    </text>
  </g>

  <!-- ════════ SLIDE 2: PROJECTS ════════ -->
  <g class="slide-2">
    <text y="62">
      <tspan x="24" class="prompt-user">lehuy@workstation:~$</tspan>
      <tspan class="cmd"> ls -la ./projects/</tspan>
      <tspan class="cursor" fill="#38bdf8">_</tspan>
    </text>
    
    <text y="96">
      <tspan x="24" class="key">drwxr-xr-x</tspan>
      <tspan x="125" class="val-bold">mobile-apps/</tspan>
      <tspan x="250" class="val-dim">Flutter · React Native · Redux · REST APIs</tspan>
    </text>
    <text y="118">
      <tspan x="250" class="meta">↳ Cross-platform apps with smooth 60fps UX &amp; native performance</tspan>
    </text>
    
    <text y="152">
      <tspan x="24" class="key">drwxr-xr-x</tspan>
      <tspan x="125" class="val-bold">web-platform/</tspan>
      <tspan x="250" class="val-dim">React · TypeScript · NodeJS · SQL</tspan>
    </text>
    <text y="174">
      <tspan x="250" class="meta">↳ Fullstack web platform with scalable backend &amp; responsive UI</tspan>
    </text>
  </g>

  <!-- ════════ SLIDE 3: TECH STACK ════════ -->
  <g class="slide-3">
    <text y="62">
      <tspan x="24" class="prompt-user">lehuy@workstation:~$</tspan>
      <tspan class="cmd"> cat stack.txt</tspan>
      <tspan class="cursor" fill="#38bdf8">_</tspan>
    </text>
    
    <text y="90">
      <tspan x="24" class="key">languages</tspan>
      <tspan x="125" class="val">Java · JavaScript · TypeScript · SQL</tspan>
    </text>
    
    <text y="114">
      <tspan x="24" class="key">frameworks</tspan>
      <tspan x="125" class="val">React · React Native · Flutter · NodeJS</tspan>
    </text>
    
    <text y="138">
      <tspan x="24" class="key">database</tspan>
      <tspan x="125" class="val">SQL (PostgreSQL, MySQL) · SQLite · MongoDB</tspan>
    </text>
    
    <text y="162">
      <tspan x="24" class="key">tools</tspan>
      <tspan x="125" class="val">Git · Docker · Postman · VS Code · Android Studio</tspan>
    </text>

    <text y="186">
      <tspan x="24" class="key">focus</tspan>
      <tspan x="125" class="val-dim">Cross-Platform Mobile · Modern Web · Scalable Backend</tspan>
    </text>
  </g>

  <!-- Bottom Status Bar (tmux / powerline style) -->
  <line x1="0" y1="206" x2="800" y2="206" stroke="#1f1f23" stroke-width="1"/>
  
  <!-- Left Status -->
  <circle cx="24" cy="223" r="3.5" fill="#22c55e"/>
  <text x="36" y="226" class="meta">zsh 5.9  <tspan fill="#3f3f46">|</tspan>  git:(<tspan fill="#e4e4e7">main</tspan>)  <tspan fill="#3f3f46">|</tspan>  utf-8</text>

  <!-- Right Status -->
  <text x="780" y="226" text-anchor="end">
    <tspan class="status-ok">200 OK</tspan>
    <tspan class="meta">  <tspan fill="#3f3f46">|</tspan>  latency: 0.8ms  <tspan fill="#3f3f46">|</tspan>  cycle: 7s</tspan>
  </text>
</svg>
